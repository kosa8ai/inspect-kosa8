[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inspect-kosa8"
version = "0.2.0"
description = "kosa8 Cloud sandbox environment for Inspect AI"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "kosa8" }]
requires-python = ">=3.10"
keywords = ["inspect-ai", "evals", "sandbox", "kosa8", "microvm"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "inspect-ai>=0.3.100",
    "httpx>=0.27",
    "pyyaml>=6",
]

[project.entry-points.inspect_ai]
inspect_kosa8 = "inspect_kosa8._registry"

[project.urls]
Homepage = "https://kosa8.com"
Documentation = "https://github.com/kosa8ai/inspect-kosa8#readme"
Repository = "https://github.com/kosa8ai/inspect-kosa8"
Issues = "https://github.com/kosa8ai/inspect-kosa8/issues"

[dependency-groups]
test = ["pytest>=8", "pytest-asyncio>=0.23"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[tool.hatch.build.targets.wheel]
packages = ["inspect_kosa8"]

[tool.hatch.build.targets.sdist]
include = ["inspect_kosa8", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "RUF100"]

[tool.ruff.lint.per-file-ignores]
"tests/test_self_check.py" = ["F403"]
"tests/test_live_self_check.py" = ["F403"]
"tests/*" = ["ASYNC"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = false
files = ["inspect_kosa8"]
